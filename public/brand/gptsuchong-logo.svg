<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <title>GPT 速充</title>
  <style>
    :root { color: #0d0d0d; }
    @media (prefers-color-scheme: dark) { :root { color: #ececec; } }
  </style>
  <defs>
    <path id="bolt" d="M20.8 2.2 8.8 18h7l-3.6 11.8L25 12h-7.3Z"/>
    <!-- A 1.75-unit cutout gives a ~1.5px gap at the 28px navbar size. -->
    <mask id="ring-cutout" x="0" y="0" width="32" height="32" maskUnits="userSpaceOnUse" style="mask-type: luminance">
      <rect width="32" height="32" fill="white"/>
      <use href="#bolt" fill="black" stroke="black" stroke-width="3.5" stroke-linejoin="round"/>
    </mask>
  </defs>
  <path d="M24.13 7.87A11.5 11.5 0 1 0 27.5 16h-7"
    stroke="currentColor" stroke-width="3" stroke-linecap="round" mask="url(#ring-cutout)"/>
  <use href="#bolt" fill="currentColor"/>
</svg>
